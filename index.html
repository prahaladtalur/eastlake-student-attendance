<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4ee" />
    <meta name="description" content="Check your Eastlake Speech & Debate attendance." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Student Attendance · Eastlake Speech &amp; Debate</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Eastlake student attendance home">
          <span class="brand-mark" aria-hidden="true">E</span>
          <span class="brand-copy">
            <span class="brand-name">Eastlake</span>
            <span class="brand-subtitle">Speech &amp; Debate</span>
          </span>
        </a>
        <span class="portal-label"><span class="live-dot" aria-hidden="true"></span> STUDENT PORTAL</span>
      </header>

      <main id="app" class="main-content" aria-live="polite">
        <div class="loading-card" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>Loading the roster…</span>
        </div>
      </main>

      <footer class="site-footer">
        <span>Eastlake Speech &amp; Debate</span>
        <span>Need a correction? Ask your coach.</span>
      </footer>
    </div>
    <script type="module" src="./student.mjs"></script>
  </body>
</html>
